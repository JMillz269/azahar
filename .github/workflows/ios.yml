name: ios

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      symbolicate_run_id:
        description: "Only symbolicate a crash: ID of the ios run that built the crashing IPA"
        required: false
        default: ""
      symbolicate_offsets:
        description: "Space separated imageOffset values (decimal) of the Azahar crash frames"
        required: false
        default: ""

# macOS runners are scarce, only build the latest push of each branch.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symbolicate:
    # Maps crash report offsets to functions using the IPA of an earlier run, without building.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.symbolicate_run_id != '' }}
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          run-id: ${{ inputs.symbolicate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ipa
      - name: Symbolicate
        env:
          OFFSETS: ${{ inputs.symbolicate_offsets }}
        run: |
          cd ipa
          unzip -q Azahar-unsigned.ipa
          BIN=Payload/Azahar.app/Azahar
          echo "Binary UUID:"
          dwarfdump --uuid "$BIN"
          TEXT_VMADDR=$(otool -l "$BIN" | awk '/segname __TEXT$/{found=1} found && /vmaddr/{print $2; exit}')
          echo "__TEXT vmaddr: $TEXT_VMADDR"
          for offset in $OFFSETS; do
            address=$(printf "0x%x" $((TEXT_VMADDR + offset)))
            echo "$offset -> $(atos -o "$BIN" -arch arm64 -l "$TEXT_VMADDR" "$address")"
          done

  msl-validation:
    # Compiles every Metal shader the renderer can generate with Apple's offline compiler.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.symbolicate_run_id == '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Fetch headers needed by the shader generator
        run: git submodule update --init --depth 1 externals/fmt externals/boost externals/xxHash externals/nihstro
      - name: Build MSL corpus generator
        run: |
          clang++ -std=c++20 -O1 -Isrc -Iexternals/fmt/include -Iexternals/boost -Iexternals/xxHash -Iexternals/nihstro/include \
            -DFMT_HEADER_ONLY -DXXH_INLINE_ALL \
            src/video_core/renderer_metal/tests/msl_corpus.cpp \
            src/video_core/renderer_metal/tests/log_stub.cpp \
            src/video_core/shader/generator/msl_shader_gen.cpp \
            src/video_core/shader/generator/msl_shader_decompiler.cpp \
            src/video_core/shader/generator/shader_gen.cpp \
            src/video_core/pica/shader_setup.cpp \
            src/video_core/shader/generator/pica_fs_config.cpp \
            -o msl_corpus
      - name: Generate shaders
        run: ./msl_corpus msl_out 512 2>/dev/null
      - name: Compile shaders (iOS, MSL 2.4)
        run: ./.ci/ios-validate-msl.sh msl_out

  ios:
    runs-on: macos-latest
    needs: msl-validation
    env:
      BUILD_DIR: build/ios
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          xcodebuild -version
      - name: Configure
        run: ./.ci/ios.sh configure
      - name: Build
        run: ./.ci/ios.sh build
      - name: Package
        run: ./.ci/ios.sh package
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: artifacts/
